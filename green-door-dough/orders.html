<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Bake Sheet · Green Door Dough</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .page { text-align: left; max-width: 860px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 20px 0; }
    .controls label { display: grid; gap: 4px; font-weight: 500; }
    .controls input { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.n { text-align: right; font-weight: 700; font-size: 1.2rem; }
    .order { break-inside: avoid; }
    .order h3 { font-size: 1.2rem; display: flex; gap: 10px; align-items: center; }
    .order ul { margin: 8px 0; padding-left: 20px; }
    .order .notes { background: #f3e3c6; padding: 6px 10px; border-radius: 8px; }
    .error { color: #a33a1f; font-weight: 500; }
    @media print {
      .controls, .no-print { display: none !important; }
      body { background: #fff; }
      .page { padding: 0; }
      .card { border: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Bake sheet</h1>
    <form class="controls" data-form>
      <label>Password <input type="password" name="password" autocomplete="current-password" required /></label>
      <label>Pickup date <input type="date" name="date" required /></label>
      <button class="btn" type="submit">Load orders</button>
      <button class="btn no-print" type="button" onclick="print()" style="background: var(--crust)">Print</button>
    </form>
    <p class="error" data-error></p>
    <div data-out></div>
  </main>
  <script type="module">
    import { SHOP, formatMoney } from './shop.js';
    const form = document.querySelector('[data-form]');
    const out = document.querySelector('[data-out]');
    const err = document.querySelector('[data-error]');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Default to the next pickup day (today, if it is pickup day).
    const d = new Date();
    d.setDate(d.getDate() + ((SHOP.pickup.weekday - d.getDay() + 7) % 7));
    form.date.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    try { form.password.value = sessionStorage.getItem('gdd-admin') || ''; } catch {}

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      out.innerHTML = '<p class="muted">Loading…</p>';
      try {
        const res = await fetch(`/api/orders?date=${form.date.value}`, {
          headers: { Authorization: `Bearer ${form.password.value}` },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not load orders.');
        try { sessionStorage.setItem('gdd-admin', form.password.value); } catch {}
        render(data);
      } catch (e) {
        out.innerHTML = '';
        err.textContent = e.message;
      }
    });

    function render({ date, orders, totals, revenue }) {
      const label = new Date(date + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'long', month: 'long', day: 'numeric' });
      out.innerHTML = `
        <div class="card">
          <h2>${label}</h2>
          <p><strong>${orders.length}</strong> orders · <strong>${formatMoney(revenue)}</strong> collected</p>
          <h3 style="margin-top:16px">What to bake</h3>
          <table>${totals.filter((t) => t.qty).map((t) => `<tr><td>${esc(t.name)}</td><td class="n">${t.qty}</td></tr>`).join('') || '<tr><td class="muted">No orders yet.</td></tr>'}</table>
        </div>
        ${orders.map((o) => `
          <div class="card order">
            <h3><input type="checkbox" aria-label="Picked up" /> ${esc(o.name)}</h3>
            <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul>
            ${o.notes ? `<p class="notes">📝 ${esc(o.notes)}</p>` : ''}
            <p class="muted">${esc(o.phone)} · ${esc(o.email)} · ${formatMoney(o.amount)}</p>
          </div>`).join('')}`;
    }
  </script>
</body>
</html>
